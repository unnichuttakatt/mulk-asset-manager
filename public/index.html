<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mulk IT Assets</title>
  <meta name="theme-color" content="#0e5e56">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/config.js"></script>
  <script>
    window.addEventListener('error', function (ev) {
      var root = document.getElementById('app');
      if (!root || !root.querySelector('.boot')) return;
      var msg = (ev && ev.message) ? String(ev.message) : 'The page script did not start.';
      var where = ev && ev.filename ? ' ' + ev.filename + ':' + (ev.lineno || '') : '';
      root.innerHTML = '<div class="err" style="margin:24px">The app did not open. Refresh the page. ' + (msg + where).replace(/[<>]/g, '') + '</div>';
    });
  </script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app"><div class="boot">Loading…</div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
